# 경험 은행 / Experience bank — 자기소개서 초안의 유일한 재료
#
#   cp config/experience.example.yaml config/experience.yaml
#
# config/experience.yaml 은 git에 올라가지 않는다(.gitignore). 이 레포는 공개 저장소이므로
# 실제 경력·이름·연락처는 절대 이 예시 파일에 쓰지 말 것.
#
# 경험(episodes)은 한 번 STAR로 써 두면 모든 지원서에 재사용된다. 초안은 여기 적힌 사실만
# 쓰고, 없는 내용은 [작성 필요]로 남긴다. 결과(result)에 숫자가 있으면 우선 선택된다.
# tags: 협업·소통·갈등·리더십 / 도전·끈기·실패·극복·문제해결 / 분석·데이터·실무 /
#       가치관·성장·책임감 + 직무 단어(무역, 마케팅, 엑셀 ...)

name: 홍길동
headline: 데이터로 문제를 정의하고 끝까지 실행하는 신입
education:
  - ○○대학교 ○○학과 (2020.03–2026.02)
skills: [엑셀, SQL, 파워포인트]
certificates: [컴퓨터활용능력 1급]
languages: [TOEIC 900]

# 지원 동기의 공통 재료: 왜 이 산업·직무인가 (회사별 내용은 초안이 [확인 필요]로 남긴다)
motivation: >-
  학과 프로젝트에서 수출 중소기업의 판로 문제를 조사하며, 좋은 제품이 시장을 찾도록 돕는 일에
  보람을 느꼈습니다.
# 입사 후 포부의 공통 재료
goals: >-
  입사 1년 안에 담당 업무의 데이터를 스스로 정리해 보고할 수 있는 실무자가 되고, 3년 안에
  신규 시장 개척 프로젝트를 주도하고 싶습니다.

episodes:
  - title: 동아리 수출 컨설팅 프로젝트에서 바이어 응답률 3배
    period: 2023.03–2023.12
    tags: [협업, 소통, 무역, 해외영업, 데이터]
    situation: 5명이 중소기업 한 곳의 동남아 수출을 돕는 프로젝트를 맡았습니다.
    task: 저는 바이어 발굴과 연락을 담당했지만 첫 달 응답률이 4%에 그쳤습니다.
    action: >-
      응답이 온 메일과 없는 메일을 비교해 제목과 첫 문장을 바꾸고, 팀원들과 매주 결과를 공유해
      나라별 문구를 따로 만들었습니다.
    result: 두 달 만에 응답률을 12%로 올려 상담 8건을 연결했습니다.
    lesson: 감이 아니라 데이터로 원인을 찾고, 팀과 빨리 공유해야 개선이 빨라진다는 것을 배웠습니다.
  - title: 3개월 준비로 컴퓨터활용능력 1급 취득
    period: 2024.01–2024.03
    tags: [도전, 끈기, 엑셀]
    situation: 전공과 무관한 자격이라 처음 모의고사 점수가 40점이었습니다.
    task: 방학 3개월 안에 합격하는 것이 목표였습니다.
    action: 틀린 유형을 매일 기록하고, 약한 함수 유형만 따로 모아 하루 2시간씩 반복했습니다.
    result: 두 번째 시험에서 합격했고, 이후 과제 데이터 정리 시간을 절반으로 줄였습니다.
    lesson: 목표를 잘게 나누고 기록하면 낯선 분야도 끝까지 해낼 수 있다는 자신감을 얻었습니다.
