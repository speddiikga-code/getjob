# 검색 조건 / Search profile
#
# Every site is searched for 서울 · 신입 (경력무관 포함) · 정규직 using that site's own
# filters. The settings below narrow those results further.

location:
  # Leave empty for all of Seoul, or list districts, e.g. [강남구, 서초구, 영등포구]
  districts: []

# Only keep postings whose title (or tags) contain one of these words.
# Empty = keep every posting. Example: [마케팅, 회계, 백엔드, backend]
keywords: []

# Drop postings whose title contains any of these.
exclude_keywords: [계약직, 파견, 아르바이트, 알바, 단기]

# Companies you never want to see.
exclude_companies: []

limits:
  # Newest postings to read per site on each run. Runs stop earlier once they reach
  # postings already seen. Use `getjob collect --all` once to read every posting.
  max_per_source: 300

# Which sites to search. Turn a site on or off with `enabled`.
sources:
  linkedin:    {enabled: true}
  jobkorea:    {enabled: true}   # 잡코리아
  saramin:     {enabled: true}   # 사람인
  wanted:      {enabled: true}   # 원티드
  incruit:     {enabled: true}   # 인크루트
  work24:      {enabled: true}   # 고용24 (구 워크넷)
  remember:    {enabled: true}   # 리멤버 커리어
  jumpit:      {enabled: true}   # 점핏 - IT/개발 직군
  peoplenjob:  {enabled: true}   # 피플앤잡 - 외국계 기업
  alio:        {enabled: true}   # 잡알리오 - 공공기관

notify:
  # Channels to use; each needs its secrets in .env (see .env.example)
  channels: [telegram]
  max_jobs_per_message: 20
