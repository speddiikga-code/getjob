[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "getjob"
version = "0.1.0"
description = "Automated regular-job (정규직) search in Seoul across LinkedIn and Korean job sites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Headless browser for JavaScript-rendered pages; only needed by some sources.
browser = ["playwright>=1.44"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
getjob = "getjob.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
